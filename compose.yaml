# Ambiente local de desenvolvimento (ver docs/adr/001-stack.md).
# Uso: copie .env.example para .env, preencha e rode `docker compose up -d`.
# A versão da imagem deve ser a mesma usada nos testes (TestcontainersConfiguration).

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env}
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      # Só aceita conexões da própria máquina, não da rede.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # A partir do PostgreSQL 18 a imagem oficial usa /var/lib/postgresql como volume.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
