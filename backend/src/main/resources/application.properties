spring.application.name=backend

# Lê o .env da raiz do repositório quando o backend roda de dentro de backend/.
# É opcional: nos testes a conexão vem do Testcontainers (@ServiceConnection).
spring.config.import=optional:file:../.env[.properties]

# Conexão com o banco. A senha não tem valor padrão de propósito.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:plataforma}
spring.datasource.username=${DB_USER:plataforma}
spring.datasource.password=${DB_PASSWORD}
